<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#F3EEE6" />
<title>Aprendo Jugando</title>
<style>
:root{
  --bg:#F3EEE6;--card:#FFFCF7;--ink:#4A4453;--ink-soft:#6E6878;--line:#E4DCD0;
  --peach:#F2D3C2;--mint:#CDE3D6;--lilac:#E0D6EA;--sky:#CFE0EE;--sun:#F3E5B5;--rose:#F1D5DC;
  --mint-deep:#5E8F7A;--gold-deep:#B0892E;--ok:#7BA882;--ok-bg:#E7F3EA;
  --shadow:0 8px 24px rgba(74,68,83,.08);--r:26px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Helvetica Neue","Noto Sans","Noto Sans CJK SC","Noto Sans Arabic","Noto Sans Devanagari",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
body{min-height:100dvh;background:radial-gradient(ellipse at top,#F9F5EF 0%,var(--bg) 60%)}
button{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(10px + var(--st)) calc(16px + var(--sr)) calc(16px + var(--sb)) calc(16px + var(--sl))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0 10px;flex-shrink:0}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:10px 16px;font-size:1.2rem;font-weight:800;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.hbtns{display:flex;gap:8px}
.ib{width:54px;height:54px;border:1px solid var(--line);background:var(--card);border-radius:18px;display:grid;place-items:center;
  cursor:pointer;box-shadow:var(--shadow);font-size:1.45rem;position:relative;transition:transform .15s ease}
.ib:active{transform:scale(.95)}
.ib[aria-pressed="false"]{opacity:.5}
.ib .ring{position:absolute;inset:-4px;border-radius:21px;pointer-events:none;
  background:conic-gradient(var(--mint-deep) calc(var(--p,0)*1turn),transparent 0);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:4px;opacity:.8}
button:focus-visible{outline:3px solid var(--mint-deep);outline-offset:3px}
main{flex:1;display:flex;flex-direction:column;gap:14px}

/* mascot */
.hero{display:flex;align-items:center;gap:12px}
.mascot{flex:0 0 auto;width:110px;height:110px;cursor:pointer;border:0;background:none;padding:0}
.mascot.sm{width:84px;height:84px}
.mascot svg{width:100%;height:100%;display:block;overflow:visible}
.bubble{position:relative;flex:1;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;
  font-size:1.3rem;font-weight:800;line-height:1.3;box-shadow:var(--shadow);min-height:64px;display:flex;align-items:center;gap:10px;cursor:pointer}
.bubble .t{flex:1}
.bubble .spk{font-size:1.2rem;opacity:.6}
.m-body{transform-origin:60px 100px;animation:bob 4.5s ease-in-out infinite}
.m-eyes{transform-origin:60px 56px;animation:blink 6s infinite}
.m-mouth{transform-origin:60px 84px}
.talking .m-mouth{animation:talk .32s ease-in-out infinite alternate}
.dance .m-body{animation:dance 1.6s ease-in-out 1}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes talk{from{transform:scaleY(1)}to{transform:scaleY(1.5)}}
@keyframes dance{0%{transform:translateY(0) rotate(0)}15%{transform:translateY(-8px) rotate(-7deg)}30%{transform:translateY(0) rotate(0)}
  45%{transform:translateY(-8px) rotate(7deg)}60%{transform:translateY(0) rotate(0)}75%{transform:translateY(-6px) rotate(-4deg)}100%{transform:translateY(0) rotate(0)}}

/* languages */
.langs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.langs::-webkit-scrollbar{display:none}
.lang{flex:0 0 auto;scroll-snap-align:start;display:flex;align-items:center;gap:8px;min-height:58px;padding:0 16px;border-radius:20px;
  border:2px solid var(--line);background:var(--card);font-size:1.1rem;font-weight:800;cursor:pointer;box-shadow:var(--shadow)}
.lang .f{font-size:1.7rem;line-height:1}
.lang[aria-pressed="true"]{border-color:var(--mint-deep);background:var(--ok-bg)}
.langgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.langgrid .lang{min-height:64px}
.note{font-size:.95rem;color:var(--ink-soft);background:#F7EFDF;border-radius:14px;padding:8px 12px}

/* home */
h2{font-size:1.25rem;font-weight:800;color:var(--ink-soft);text-align:center}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcard{border:0;border-radius:var(--r);min-height:132px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease}
.gcard:active{transform:scale(.97)}
.gcard .ic{font-size:3rem;line-height:1}
.gcard .nm{font-size:1.25rem;font-weight:800}
.gcard .lv{font-size:.85rem;font-weight:700;color:var(--ink-soft)}
.c-peach{background:var(--peach)}.c-mint{background:var(--mint)}.c-lilac{background:var(--lilac)}
.c-sky{background:var(--sky)}.c-sun{background:var(--sun)}.c-rose{background:var(--rose)}
.big{border:0;min-height:68px;border-radius:22px;font-size:1.25rem;font-weight:800;cursor:pointer;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;gap:10px;padding:0 18px;background:var(--card);border:1px solid var(--line)}
.big.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.big:active{transform:scale(.98)}

/* game */
.gtitle{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gtitle .nm{font-size:1.35rem;font-weight:800}
.lvl{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--ink-soft);font-size:.95rem}
.dots{display:flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--gold-deep)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modes button{min-height:56px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:1.15rem;font-weight:800;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.choices{display:grid;gap:12px}
.choices.n2{grid-template-columns:1fr 1fr}
.choices.n3{grid-template-columns:1fr 1fr 1fr}
.choices.n4{grid-template-columns:1fr 1fr}
.choice{border:3px solid var(--line);background:var(--card);border-radius:var(--r);min-height:150px;display:grid;place-items:center;
  cursor:pointer;box-shadow:var(--shadow);transition:opacity .4s ease,border-color .3s ease,background .3s ease;padding:8px}
.choices.n2 .choice{min-height:210px}.choices.n3 .choice{min-height:160px}.choices.n4 .choice{min-height:170px}
.choices.n2 .face{font-size:5.4rem}.choices.n2 .sw{width:110px;height:110px}.choices.n2 .shape{width:120px;height:120px}.choices.n2 .digit{font-size:4.6rem}
.choice:active{transform:scale(.97)}
.choice.no{opacity:.4;pointer-events:none}
.choice.yes{border-color:var(--ok);background:var(--ok-bg)}
.choice.hint{border-color:#D9C27A;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(217,194,122,.0)}50%{box-shadow:0 0 0 8px rgba(217,194,122,.35)}}
.face{font-size:4.2rem;line-height:1}
.choices.n3 .face{font-size:3.2rem}
.sw{width:84px;height:84px;border-radius:50%;border:4px solid rgba(74,68,83,.08);box-shadow:inset 0 -8px 14px rgba(0,0,0,.08)}
.choices.n3 .sw{width:70px;height:70px}
.shape{width:96px;height:96px}.choices.n3 .shape{width:78px;height:78px}
.shape svg{width:100%;height:100%;display:block}
.digit{font-size:3.6rem;font-weight:900}
.objs{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-wrap:wrap;justify-content:center;
  gap:6px;font-size:2.5rem;line-height:1.15;min-height:90px;align-items:center;box-shadow:var(--shadow)}
.next{margin-top:auto}
.learnbox{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:32px;
  padding:22px 16px;box-shadow:var(--shadow);cursor:pointer}
.learnbox .face{font-size:7.5rem}.learnbox .sw{width:150px;height:150px}.learnbox .shape{width:160px;height:160px}
.learnbox .digit{font-size:6rem}
.learnbox .lname{font-size:2rem;font-weight:900;text-align:center}
.lnav{display:flex;gap:10px;align-items:center}
.lnav .big{flex:1}
.lnav .cnt{min-width:56px;text-align:center;font-weight:800;color:var(--ink-soft)}

/* memory */
.mem{display:grid;gap:12px}
.mem.c2{grid-template-columns:1fr 1fr}.mem.c3{grid-template-columns:1fr 1fr 1fr}
.card{border:0;background:none;aspect-ratio:3/4;perspective:800px;cursor:pointer;padding:0}
.card .in{display:block;position:relative;width:100%;height:100%;transition:transform .45s ease;transform-style:preserve-3d}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.card .fc{display:grid;position:absolute;inset:0;border-radius:22px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:var(--shadow);border:3px solid var(--line)}
.card .bk{background:repeating-linear-gradient(45deg,#E0D6EA 0 12px,#E9E1F0 12px 24px);font-size:2.4rem}
.card .fr{background:var(--card);transform:rotateY(180deg);font-size:3.6rem}
.card.done .fr{border-color:var(--ok);background:var(--ok-bg)}

/* stickers */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stk{border:2px dashed var(--line);background:#F8F4EE;border-radius:24px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;cursor:pointer;padding:6px}
.stk .e{font-size:3rem;line-height:1}
.stk .n{font-size:.9rem;font-weight:800;text-align:center}
.stk.lock .e{filter:grayscale(1);opacity:.18}
.stk.got{border:2px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.progress{height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.progress b{display:block;height:100%;background:var(--gold-deep);border-radius:99px}

/* settings */
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:12px 16px;min-height:64px;font-size:1.15rem;font-weight:800;cursor:pointer;width:100%;text-align:start}
.sw2{flex:0 0 auto;width:60px;height:36px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw2::after{content:"";position:absolute;top:4px;inset-inline-start:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:inset-inline-start .2s}
.row[aria-checked="true"] .sw2{background:var(--mint-deep)}
.row[aria-checked="true"] .sw2::after{inset-inline-start:28px}
.danger{color:#9A5A4A}

/* overlay + toast */
.ov{position:fixed;inset:0;background:rgba(74,68,83,.28);display:grid;place-items:center;z-index:10;padding:24px}
.ovc{background:var(--card);border-radius:32px;padding:26px 22px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.15);
  display:flex;flex-direction:column;gap:14px;align-items:center;animation:pop .5s ease}
.ovc .e{font-size:6rem;line-height:1}
.ovc .tx{font-size:1.4rem;font-weight:900}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sb));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;
  font-weight:700;z-index:11;max-width:90vw;text-align:center}
.sparkle{position:absolute;pointer-events:none;font-size:1.4rem;animation:spark 1.2s ease-out forwards}
@keyframes spark{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}

/* calm / reduced motion */
.calm *,.calm *::before,.calm *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media (min-width:700px){#app{max-width:720px}.games{grid-template-columns:1fr 1fr 1fr}.gcard{min-height:170px}
  .choice{min-height:200px}.face{font-size:5.5rem}.sgrid{grid-template-columns:repeat(5,1fr)}.langgrid{grid-template-columns:1fr 1fr 1fr}
  .mascot{width:140px;height:140px}
  #app .choices .choice{min-height:260px}#app .choices .face{font-size:7rem}#app .choices .shape{width:170px;height:170px}#app .choices .sw{width:160px;height:160px}#app .choices .digit{font-size:6rem}
  #app .mascot.sm{width:110px;height:110px}.bubble{font-size:1.6rem}.objs{font-size:3.6rem}}
@media (max-width:360px){.choice{min-height:120px}.face{font-size:3.4rem}.gcard{min-height:116px}.gcard .ic{font-size:2.5rem}.bubble{font-size:1.1rem}}

</style>
</head>

}

/* ---------- play ---------- */
function newQuestion() {
  var g = V.game, k = nChoices(g), correct, opts;
  V.answered = false; V.wrong = 0; V.qn++;
  if (g.kind === "num") {
    var max = [5, 7, 10][lv(g.id).level - 1] || 10;
    do { correct = 1 + Math.floor(Math.random() * max); } while (correct === V.last && max > 1);
    var pool = shuffle(range(max).map(function (x) { return x + 1; }).filter(function (x) { return x !== correct; }));
    opts = shuffle([correct].concat(pool.slice(0, k - 1)));
    V.q = { correct: correct, opts: opts, prompt: t("howMany"), obj: OBJ[Math.floor(Math.random() * OBJ.length)] };
  } else {
    do { correct = Math.floor(Math.random() * g.n); } while (correct === V.last);
    var others = shuffle(range(g.n).filter(function (x) { return x !== correct; }));
    opts = shuffle([correct].concat(others.slice(0, k - 1)));
    var name = itemName(g.kind, correct), pr;
    if (g.kind === "emo") pr = t("qEmo", { x: name });
    else if (g.kind === "col") pr = t("qCol", { x: name });
    else if (g.kind === "sha") pr = t("qSha", { x: name });
    else pr = (V.qn % 2) ? t("qAni", { s: L().AS[correct] }) : t("qAniName", { x: name });
    V.q = { correct: correct, opts: opts, prompt: pr };
  }
  V.last = correct;
  renderPlay();
}
function renderPlay() {
  var g = V.game, q = V.q, h = topHTML(g) + heroHTML(true);
  if (g.kind === "num") { var o = ""; for (var i = 0; i < q.correct; i++) o += "<span>" + q.obj + "</span>"; h += '<div class="objs" id="objs" aria-hidden="true">' + o + "</div>"; }
  h += '<div class="choices n' + q.opts.length + '" id="choices">';
  q.opts.forEach(function (v) { h += '<button type="button" class="choice" data-v="' + v + '" aria-label="' + esc(itemName(g.kind, v)) + '">' + visual(g.kind, v) + "</button>"; });
  h += '</div><button type="button" class="big primary next" id="nx" hidden>' + esc(t("next")) + "</button>";
  screenEl.innerHTML = h;
  bindModes(); V.bubble = q.prompt; bindHero(); speak(q.prompt);
  var cs = screenEl.querySelectorAll(".choice");
  for (var j = 0; j < cs.length; j++) cs[j].addEventListener("click", onChoice);
  document.getElementById("nx").addEventListener("click", function () { sfx("tap"); newQuestion(); });
}
function onChoice(e) {
  if (V.answered) return;
  var b = e.currentTarget, v = parseInt(b.getAttribute("data-v"), 10), g = V.game;
  if (v === V.q.correct) {
    V.answered = true; b.classList.add("yes");
    var others = screenEl.querySelectorAll(".choice:not(.yes)"); for (var i = 0; i < others.length; i++) others[i].classList.add("no");
    sfx("yes"); dance(); sparkle(b);
    var praise = L().praise[Math.floor(Math.random() * L().praise.length)];
    var extra = g.kind === "ani" ? cap(t("aniSays", { x: L().A[v], s: L().AS[v] })) : cap(itemName(g.kind, v));
    say(praise + " " + extra);
    reward(g, 1, 1);
    var nx = document.getElementById("nx"); nx.hidden = false;
  } else {
    V.wrong++; b.classList.add("no"); sfx("soft");
    say(t("tryAgain") + ". " + V.q.prompt);
    if (V.wrong >= 2) { var c = screenEl.querySelector('.choice[data-v="' + V.q.correct + '"]'); if (c) c.classList.add("hint"); }
  }
}
function sparkle(el) {
  if (calm()) return;
  var r = el.getBoundingClientRect();
  ["⭐", "✨", "⭐"].forEach(function (s, i) {
    var d = document.createElement("span"); d.className = "sparkle"; d.textContent = s;
    d.style.left = (r.left + r.width * (0.25 + i * 0.25)) + "px"; d.style.top = (r.top + window.scrollY + 10) + "px"; d.style.position = "absolute";
    document.body.appendChild(d); setTimeout(function () { d.remove(); }, 1300);
  });
}
function reward(g, stars, prog) {
  S.stars += stars;
  var st = lv(g.id), need = g.kind === "mem" ? NEED_MEM : NEED, leveled = false;
  st.prog += prog;
  if (st.prog >= need) { st.prog = 0; if (st.level < 3) { st.level++; leveled = true; } }
  var newStk = null, target = Math.min(STK.length, Math.floor(S.stars / STARS_PER_STICKER));
  if (target > S.stickers) { S.stickers = target; newStk = target - 1; }
  save(); updHeader();
  var l = document.getElementById("lvl"); if (l) l.innerHTML = esc(t("level", { n: st.level })) + " " + dotsHTML(g);
  if (leveled) speak(t("levelUp", { n: st.level }), true);
  if (newStk != null) setTimeout(function () { showSticker(newStk); }, 900);
}
function showSticker(i) {
  sfx("sticker");
  var name = cap(L().K[i]), msg = t("newSticker", { x: name });
  var ov = document.createElement("div"); ov.className = "ov"; ov.setAttribute("role", "dialog");
  ov.innerHTML = '<div class="ovc"><div class="e">' + STK[i] + '</div><div class="tx">' + esc(msg) + '</div><button type="button" class="big primary" style="width:100%">' + esc(t("ok")) + "</button></div>";
  document.body.appendChild(ov);
  speak(msg, true);
  ov.querySelector("button").addEventListener("click", function () { sfx("tap"); ov.remove(); });
}

/* ---------- memory ---------- */
function newMemory() {
  var g = V.game, level = lv(g.id).level, pairs = level === 1 ? 2 : 3;
  var pool = level === 3 ? range(STK.length) : (V.qn % 2 ? range(5) : range(5).map(function (x) { return x + 5; }));
  V.qn++;
  var picks = shuffle(pool).slice(0, pairs), cards = shuffle(picks.concat(picks));
  V.mem = { cards: cards, up: [], done: {}, lock: false, found: 0, pairs: pairs };
  var h = topHTML(g) + heroHTML(true) + '<div class="mem ' + (cards.length === 4 ? "c2" : "c3") + '" id="mem">';
  cards.forEach(function (c, i) {
    h += '<button type="button" class="card" data-i="' + i + '" aria-label="?"><span class="in"><span class="fc bk" aria-hidden="true">⭐</span><span class="fc fr">' + STK[c] + "</span></span></button>";
  });
  h += '</div><button type="button" class="big primary next" id="nx" hidden>' + esc(t("next")) + "</button>";
  screenEl.innerHTML = h;
  V.bubble = t("memIntro"); bindHero(); speak(V.bubble);
  var cs = screenEl.querySelectorAll(".card"); for (var i = 0; i < cs.length; i++) cs[i].addEventListener("click", onCard);
  document.getElementById("nx").addEventListener("click", function () { sfx("tap"); newMemory(); });
}
function onCard(e) {
  var m = V.mem, b = e.currentTarget, i = parseInt(b.getAttribute("data-i"), 10);
  if (m.lock || m.done[i] || m.up.indexOf(i) >= 0) return;
  b.classList.add("up"); b.setAttribute("aria-label", L().K[m.cards[i]]); sfx("flip"); m.up.push(i);
  setBubble(cap(L().K[m.cards[i]])); speak(cap(L().K[m.cards[i]]));
  if (m.up.length < 2) return;
  var a = m.up[0], c = m.up[1];
  if (m.cards[a] === m.cards[c]) {
    m.done[a] = m.done[c] = true; m.up = []; m.found++;
    setTimeout(function () {
      screenEl.querySelector('[data-i="' + a + '"]').classList.add("done"); screenEl.querySelector('[data-i="' + c + '"]').classList.add("done");
      sfx("yes"); dance();
      if (m.found === m.pairs) { say(t("memDone")); reward(V.game, 2, 1); document.getElementById("nx").hidden = false; }
      else { say(L().praise[m.found % L().praise.length], true); }
    }, 350);
  } else {
    m.lock = true;
    setTimeout(function () {
      [a, c].forEach(function (k) { var el = screenEl.querySelector('[data-i="' + k + '"]'); if (el) { el.classList.remove("up"); el.setAttribute("aria-label", "?"); } });
      m.up = []; m.lock = false;
    }, 1300);
  }
}

/* ---------- stickers ---------- */
function renderStickers() {
  V.screen = "stickers"; updHeader();
  V.bubble = t("stickers") + ": " + S.stickers + "/" + STK.length;
  var pct = Math.round(((S.stars % STARS_PER_STICKER) / STARS_PER_STICKER) * 100);
  var h = heroHTML(true) + "<h2>🏅 " + esc(t("stickers")) + " · " + S.stickers + "/" + STK.length + "</h2>";
  if (S.stickers < STK.length) h += '<p class="note">' + esc(t("stickersHint")) + ' ⭐</p><div class="progress" aria-hidden="true"><b style="width:' + Math.max(6, pct) + '%"></b></div>';
  h += '<div class="sgrid">';
  STK.forEach(function (e, i) {
    var got = i < S.stickers;
    h += '<button type="button" class="stk ' + (got ? "got" : "lock") + '" data-s="' + i + '" aria-label="' + (got ? esc(L().K[i]) : "?") + '"><span class="e" aria-hidden="true">' + e + '</span><span class="n">' + (got ? esc(cap(L().K[i])) : "?") + "</span></button>";
  });
  h += '</div><button type="button" class="big" id="bk">' + esc(t("back")) + "</button>";
  screenEl.innerHTML = h; bindHero(); speak(V.bubble);
  var ss = screenEl.querySelectorAll("[data-s]");
  for (var i = 0; i < ss.length; i++) ss[i].addEventListener("click", function (e) {
    var k = parseInt(e.currentTarget.getAttribute("data-s"), 10); sfx("tap");
    if (k < S.stickers) { say(cap(L().K[k])); dance(); } else say(t("stickersHint"));
  });
  document.getElementById("bk").addEventListener("click", function () { sfx("tap"); renderHome(); });
}

/* ---------- parent settings (hold 3 s) ---------- */
var holdT = null, holdStart = 0, holdIv = 0, swallow = 0;
function holdBegin() {
  holdEnd(); holdStart = Date.now();
  holdIv = setInterval(function () { navBtn.style.setProperty("--p", Math.min(1, (Date.now() - holdStart) / 3000)); }, 50);
  holdT = setTimeout(function () { holdEnd(); swallow = Date.now(); sfx("tap"); renderSettings(); }, 3000);
}
function holdEnd() { clearTimeout(holdT); clearInterval(holdIv); holdT = 0; holdIv = 0; navBtn.style.setProperty("--p", 0); holdStart = 0; }
function renderSettings() {
  V.screen = "settings"; updHeader();
  var rows = [["voice", "🗣️"], ["sfx", "🔔"], ["music", "🎵"], ["calm", "🐢"]];
  var labels = { voice: t("voice"), sfx: t("sounds"), music: t("music"), calm: t("motion") };
  var h = "<h2>🔒 " + esc(t("parents")) + '</h2><div class="rows">';
  rows.forEach(function (r) { h += '<button type="button" class="row" role="switch" data-set="' + r[0] + '" aria-checked="' + !!S.s[r[0]] + '"><span>' + r[1] + " " + esc(labels[r[0]]) + '</span><span class="sw2" aria-hidden="true"></span></button>'; });
  h += "</div><h2>🌐 " + esc(t("language")) + "</h2>" + langButtons("langgrid") +
    '<button type="button" class="big danger" id="rst">🗑️ ' + esc(t("reset")) + '</button><button type="button" class="big primary" id="bk">' + esc(t("back")) + "</button>";
  screenEl.innerHTML = h;
  bindLang(renderSettings);
  var rs = screenEl.querySelectorAll("[data-set]");
  for (var i = 0; i < rs.length; i++) rs[i].addEventListener("click", function (e) {
    var k = e.currentTarget.getAttribute("data-set"); S.s[k] = !S.s[k]; save();
    e.currentTarget.setAttribute("aria-checked", String(S.s[k]));
    if (k === "music") setMusic(S.s.music);
    if (k === "calm") applyCalm();
    if (k === "voice" && !S.s.voice && synth) try { synth.cancel(); } catch (x) {}
    updHeader(); sfx("tap");
  });
  var armed = false, rst = document.getElementById("rst");
  rst.addEventListener("click", function () {
    if (!armed) { armed = true; rst.textContent = "⚠️ " + t("resetConfirm"); setTimeout(function () { armed = false; if (rst.isConnected) rst.textContent = "🗑️ " + t("reset"); }, 4000); return; }
    S.stars = 0; S.stickers = 0; S.levels = {}; save(); updHeader(); toast(t("resetDone")); armed = false; rst.textContent = "🗑️ " + t("reset");
  });
  document.getElementById("bk").addEventListener("click", function () { sfx("tap"); renderHome(); });
}

/* ---------- boot ---------- */
function boot() {
  screenEl = document.getElementById("screen"); starEl = document.getElementById("starCount");
  voiceBtn = document.getElementById("voiceBtn"); musicBtn = document.getElementById("musicBtn"); navBtn = document.getElementById("navBtn");
  applyLang(); applyCalm();
  voiceBtn.addEventListener("click", function () {
    S.s.voice = !S.s.voice; save(); updHeader();
    if (!S.s.voice) { if (synth) try { synth.cancel(); } catch (e) {} } else speak(V.bubble);
  });
  musicBtn.addEventListener("click", function () { S.s.music = !S.s.music; save(); setMusic(S.s.music); updHeader(); });
  navBtn.addEventListener("pointerdown", function (e) {
    if (V.screen !== "home") return;
    holdBegin();
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) {
    navBtn.addEventListener(ev, function () {
      if (V.screen !== "home" || !holdStart) return;
      var short = Date.now() - holdStart < 3000; holdEnd();
      if (short && ev === "pointerup") toast("🔒 " + t("parents") + ": " + t("hold"));
    });
  });
  navBtn.addEventListener("pointerup", function () { if (swallow) setTimeout(function () { swallow = 0; }, 400); });
  navBtn.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  navBtn.addEventListener("click", function () {
    if (V.screen === "home") return;
    if (swallow && Date.now() - swallow < 8000) { swallow = 0; return; }
    if (synth) try { synth.cancel(); } catch (e) {}
    sfx("tap"); renderHome();
  });
  route();
  window.addEventListener("hashchange", route);
}
/* deep links for testing: #emociones, #colores/learn, #stickers, #ajustes */
function route() {
  var h = (location.hash || "").replace(/^#\/?/, ""); var p = h.split("/");
  if (!h) return renderHome();
  if (p[0] === "stickers") return renderStickers();
  if (p[0] === "ajustes") return renderSettings();
  if (gameById(p[0])) return openGame(p[0], p[1] === "learn" || p[1] === "aprender" ? "learn" : "play");
  renderHome();
}
window.AJ = { S: S, V: V, setLang: function (c) { if (TR[c]) { S.lang = c; save(); applyLang(); route(); } }, save: save, home: renderHome, openGame: openGame, stickers: renderStickers, settings: renderSettings };
boot();
})();

</script>
