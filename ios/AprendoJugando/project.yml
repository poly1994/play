name: AprendoJugando
options:
  bundleIdPrefix: com.oscarrapalo
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: es
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    SUPPORTS_MACCATALYST: "NO"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
targets:
  AprendoJugando:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: AprendoJugando
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oscarrapalo.aprendojugando
        PRODUCT_NAME: AprendoJugando
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: AprendoJugando/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Aprendo Jugando"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_UIRequiresFullScreen: "YES"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        SWIFT_EMIT_LOC_STRINGS: "NO"
        # DEVELOPMENT_TEAM is left unset so Codemagic `xcode-project use-profiles` can set it.
        # Do not set CODE_SIGN_STYLE or CODE_SIGN_IDENTITY here.
schemes:
  AprendoJugando:
    build:
      targets:
        AprendoJugando: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
