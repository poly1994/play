<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#F3EEE6" />
<title>Aprendo Jugando</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2255%22 r=%2240%22 fill=%22%23DDB892%22/%3E%3C/svg%3E" />
<style>
:root{
  --bg:#F3EEE6;--card:#FFFCF7;--ink:#4A4453;--ink-soft:#6E6878;--line:#E4DCD0;
  --peach:#F2D3C2;--mint:#CDE3D6;--lilac:#E0D6EA;--sky:#CFE0EE;--sun:#F3E5B5;--rose:#F1D5DC;
  --mint-deep:#5E8F7A;--gold-deep:#B0892E;--ok:#7BA882;--ok-bg:#E7F3EA;
  --shadow:0 8px 24px rgba(74,68,83,.08);--r:26px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Helvetica Neue","Noto Sans","Noto Sans CJK SC","Noto Sans Arabic","Noto Sans Devanagari",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
body{min-height:100dvh;background:radial-gradient(ellipse at top,#F9F5EF 0%,var(--bg) 60%)}
button{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(10px + var(--st)) calc(16px + var(--sr)) calc(16px + var(--sb)) calc(16px + var(--sl))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0 10px;flex-shrink:0}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:10px 16px;font-size:1.2rem;font-weight:800;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.hbtns{display:flex;gap:8px}
.ib{width:54px;height:54px;border:1px solid var(--line);background:var(--card);border-radius:18px;display:grid;place-items:center;
  cursor:pointer;box-shadow:var(--shadow);font-size:1.45rem;position:relative;transition:transform .15s ease}
.ib:active{transform:scale(.95)}
.ib[aria-pressed="false"]{opacity:.5}
.ib .ring{position:absolute;inset:-4px;border-radius:21px;pointer-events:none;
  background:conic-gradient(var(--mint-deep) calc(var(--p,0)*1turn),transparent 0);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:4px;opacity:.8}
button:focus-visible{outline:3px solid var(--mint-deep);outline-offset:3px}
main{flex:1;display:flex;flex-direction:column;gap:14px}

/* mascot */
.hero{display:flex;align-items:center;gap:12px}
.mascot{flex:0 0 auto;width:110px;height:110px;cursor:pointer;border:0;background:none;padding:0}
.mascot.sm{width:84px;height:84px}
.mascot svg{width:100%;height:100%;display:block;overflow:visible}
.bubble{position:relative;flex:1;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;
  font-size:1.3rem;font-weight:800;line-height:1.3;box-shadow:var(--shadow);min-height:64px;display:flex;align-items:center;gap:10px;cursor:pointer}
.bubble .t{flex:1}
.bubble .spk{font-size:1.2rem;opacity:.6}
.m-body{transform-origin:60px 100px;animation:bob 4.5s ease-in-out infinite}
.m-eyes{transform-origin:60px 56px;animation:blink 6s infinite}
.m-mouth{transform-origin:60px 84px}
.talking .m-mouth{animation:talk .32s ease-in-out infinite alternate}
.dance .m-body{animation:dance 1.6s ease-in-out 1}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes talk{from{transform:scaleY(1)}to{transform:scaleY(1.5)}}
@keyframes dance{0%{transform:translateY(0) rotate(0)}15%{transform:translateY(-8px) rotate(-7deg)}30%{transform:translateY(0) rotate(0)}
  45%{transform:translateY(-8px) rotate(7deg)}60%{transform:translateY(0) rotate(0)}75%{transform:translateY(-6px) rotate(-4deg)}100%{transform:translateY(0) rotate(0)}}

/* languages */
.langs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.langs::-webkit-scrollbar{display:none}
.lang{flex:0 0 auto;scroll-snap-align:start;display:flex;align-items:center;gap:8px;min-height:58px;padding:0 16px;border-radius:20px;
  border:2px solid var(--line);background:var(--card);font-size:1.1rem;font-weight:800;cursor:pointer;box-shadow:var(--shadow)}
.lang .f{font-size:1.7rem;line-height:1}
.lang[aria-pressed="true"]{border-color:var(--mint-deep);background:var(--ok-bg)}
.langgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.langgrid .lang{min-height:64px}
.note{font-size:.95rem;color:var(--ink-soft);background:#F7EFDF;border-radius:14px;padding:8px 12px}

/* home */
h2{font-size:1.25rem;font-weight:800;color:var(--ink-soft);text-align:center}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcard{border:0;border-radius:var(--r);min-height:132px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease}
.gcard:active{transform:scale(.97)}
.gcard .ic{font-size:3rem;line-height:1}
.gcard .nm{font-size:1.25rem;font-weight:800}
.gcard .lv{font-size:.85rem;font-weight:700;color:var(--ink-soft)}
.c-peach{background:var(--peach)}.c-mint{background:var(--mint)}.c-lilac{background:var(--lilac)}
.c-sky{background:var(--sky)}.c-sun{background:var(--sun)}.c-rose{background:var(--rose)}
.big{border:0;min-height:68px;border-radius:22px;font-size:1.25rem;font-weight:800;cursor:pointer;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;gap:10px;padding:0 18px;background:var(--card);border:1px solid var(--line)}
.big.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.big:active{transform:scale(.98)}

/* game */
.gtitle{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gtitle .nm{font-size:1.35rem;font-weight:800}
.lvl{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--ink-soft);font-size:.95rem}
.dots{display:flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--gold-deep)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modes button{min-height:56px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:1.15rem;font-weight:800;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.choices{display:grid;gap:12px}
.choices.n2{grid-template-columns:1fr 1fr}
.choices.n3{grid-template-columns:1fr 1fr 1fr}
.choices.n4{grid-template-columns:1fr 1fr}
.choice{border:3px solid var(--line);background:var(--card);border-radius:var(--r);min-height:150px;display:grid;place-items:center;
  cursor:pointer;box-shadow:var(--shadow);transition:opacity .4s ease,border-color .3s ease,background .3s ease;padding:8px}
.choices.n2 .choice{min-height:210px}.choices.n3 .choice{min-height:160px}.choices.n4 .choice{min-height:170px}
.choices.n2 .face{font-size:5.4rem}.choices.n2 .sw{width:110px;height:110px}.choices.n2 .shape{width:120px;height:120px}.choices.n2 .digit{font-size:4.6rem}
.choice:active{transform:scale(.97)}
.choice.no{opacity:.4;pointer-events:none}
.choice.yes{border-color:var(--ok);background:var(--ok-bg)}
.choice.hint{border-color:#D9C27A;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(217,194,122,.0)}50%{box-shadow:0 0 0 8px rgba(217,194,122,.35)}}
.face{font-size:4.2rem;line-height:1}
.choices.n3 .face{font-size:3.2rem}
.sw{width:84px;height:84px;border-radius:50%;border:4px solid rgba(74,68,83,.08);box-shadow:inset 0 -8px 14px rgba(0,0,0,.08)}
.choices.n3 .sw{width:70px;height:70px}
.shape{width:96px;height:96px}.choices.n3 .shape{width:78px;height:78px}
.shape svg{width:100%;height:100%;display:block}
.digit{font-size:3.6rem;font-weight:900}
.objs{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-wrap:wrap;justify-content:center;
  gap:6px;font-size:2.5rem;line-height:1.15;min-height:90px;align-items:center;box-shadow:var(--shadow)}
.next{margin-top:auto}
.learnbox{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:32px;
  padding:22px 16px;box-shadow:var(--shadow);cursor:pointer}
.learnbox .face{font-size:7.5rem}.learnbox .sw{width:150px;height:150px}.learnbox .shape{width:160px;height:160px}
.learnbox .digit{font-size:6rem}
.learnbox .lname{font-size:2rem;font-weight:900;text-align:center}
.lnav{display:flex;gap:10px;align-items:center}
.lnav .big{flex:1}
.lnav .cnt{min-width:56px;text-align:center;font-weight:800;color:var(--ink-soft)}

/* memory */
.mem{display:grid;gap:12px}
.mem.c2{grid-template-columns:1fr 1fr}.mem.c3{grid-template-columns:1fr 1fr 1fr}
.card{border:0;background:none;aspect-ratio:3/4;perspective:800px;cursor:pointer;padding:0}
.card .in{display:block;position:relative;width:100%;height:100%;transition:transform .45s ease;transform-style:preserve-3d}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.card .fc{display:grid;position:absolute;inset:0;border-radius:22px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:var(--shadow);border:3px solid var(--line)}
.card .bk{background:repeating-linear-gradient(45deg,#E0D6EA 0 12px,#E9E1F0 12px 24px);font-size:2.4rem}
.card .fr{background:var(--card);transform:rotateY(180deg);font-size:3.6rem}
.card.done .fr{border-color:var(--ok);background:var(--ok-bg)}

/* stickers */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stk{border:2px dashed var(--line);background:#F8F4EE;border-radius:24px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;cursor:pointer;padding:6px}
.stk .e{font-size:3rem;line-height:1}
.stk .n{font-size:.9rem;font-weight:800;text-align:center}
.stk.lock .e{filter:grayscale(1);opacity:.18}
.stk.got{border:2px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.progress{height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.progress b{display:block;height:100%;background:var(--gold-deep);border-radius:99px}

/* settings */
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:12px 16px;min-height:64px;font-size:1.15rem;font-weight:800;cursor:pointer;width:100%;text-align:start}
.sw2{flex:0 0 auto;width:60px;height:36px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw2::after{content:"";position:absolute;top:4px;inset-inline-start:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:inset-inline-start .2s}
.row[aria-checked="true"] .sw2{background:var(--mint-deep)}
.row[aria-checked="true"] .sw2::after{inset-inline-start:28px}
.danger{color:#9A5A4A}

/* overlay + toast */
.ov{position:fixed;inset:0;background:rgba(74,68,83,.28);display:grid;place-items:center;z-index:10;padding:24px}
.ovc{background:var(--card);border-radius:32px;padding:26px 22px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.15);
  display:flex;flex-direction:column;gap:14px;align-items:center;animation:pop .5s ease}
.ovc .e{font-size:6rem;line-height:1}
.ovc .tx{font-size:1.4rem;font-weight:900}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sb));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;
  font-weight:700;z-index:11;max-width:90vw;text-align:center}
.sparkle{position:absolute;pointer-events:none;font-size:1.4rem;animation:spark 1.2s ease-out forwards}
@keyframes spark{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}

/* calm / reduced motion */
.calm *,.calm *::before,.calm *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media (min-width:700px){#app{max-width:720px}.games{grid-template-columns:1fr 1fr 1fr}.gcard{min-height:170px}
  .choice{min-height:200px}.face{font-size:5.5rem}.sgrid{grid-template-columns:repeat(5,1fr)}.langgrid{grid-template-columns:1fr 1fr 1fr}
  .mascot{width:140px;height:140px}
  #app .choices .choice{min-height:260px}#app .choices .face{font-size:7rem}#app .choices .shape{width:170px;height:170px}#app .choices .sw{width:160px;height:160px}#app .choices .digit{font-size:6rem}
  #app .mascot.sm{width:110px;height:110px}.bubble{font-size:1.6rem}.objs{font-size:3.6rem}}
@media (max-width:360px){.choice{min-height:120px}.face{font-size:3.4rem}.gcard{min-height:116px}.gcard .ic{font-size:2.5rem}.bubble{font-size:1.1rem}}

/* v3: math games */
.mathv{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:8px}
.mpics{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 14px}
.grp{display:grid;gap:4px;line-height:1.1;background:#F8F4EE;border-radius:18px;padding:8px 10px}
.grp .p{position:relative;display:inline-block;text-align:center}
.grp .p.x i{font-style:normal;display:inline-block;animation:flyaway .9s ease-out .5s both}
.grp .p.x::after{content:"";position:absolute;inset:8% 4%;background:linear-gradient(to top right,transparent calc(50% - 2.5px),#C0605A calc(50% - 3px),#C0605A calc(50% + 3px),transparent calc(50% + 2.5px))}
@keyframes flyaway{from{opacity:1;transform:translateY(0)}to{opacity:.3;transform:translateY(-8px)}}
.calm .grp .p.x i{opacity:.3}
@media (prefers-reduced-motion:reduce){.grp .p.x i{opacity:.3}}
.op{font-size:2.4rem;font-weight:900;color:var(--ink-soft)}
.arr{display:flex;flex-direction:column;gap:5px;align-items:center}
.arow{display:flex;gap:2px;background:#F8F4EE;border-radius:12px;padding:3px 8px;line-height:1.1}
.eq{font-size:2.3rem;font-weight:900;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.eq b{display:inline-block;min-width:1.4em;text-align:center;background:var(--sun);border-radius:14px;padding:0 8px}
.learnbox .mathv{box-shadow:none;border:0;padding:0}
/* v3: groups */
.gitems{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);font-size:3.4rem;line-height:1.1}
.learnbox .gitems{box-shadow:none;border:0;font-size:4rem}
.choices.lab{grid-template-columns:1fr}
.choices.lab .choice{min-height:78px;place-items:center start;padding:8px 18px}
.glabel{display:flex;align-items:center;gap:14px;font-size:1.4rem;font-weight:900;text-align:start}
.glabel .gi{font-size:2.4rem;line-height:1}
.sortitems{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sitem{min-height:92px;border:3px solid var(--line);background:var(--card);border-radius:22px;font-size:3rem;cursor:pointer;box-shadow:var(--shadow);touch-action:none;transition:opacity .3s ease}
.sitem.sel{border-color:var(--mint-deep);background:var(--ok-bg);transform:scale(1.05)}
.sitem.gone{opacity:0;pointer-events:none}
.sitem.shake{animation:shake .45s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.basket{position:relative;min-height:170px;border:3px dashed #CDBFA8;background:#FBF6EC;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding:12px 8px;cursor:pointer}
.basket .glabel{flex-direction:column;gap:4px;font-size:1.1rem;text-align:center}
.basket .glabel .gi{font-size:2rem}
.basket .bin{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:1.9rem;min-height:2.2rem}
.basket .bk2{font-size:1.6rem;opacity:.5;margin-top:auto}
.basket.hint{border-color:#D9C27A;animation:glow 2.4s ease-in-out infinite}
.dragghost{position:fixed;z-index:20;font-size:3.4rem;pointer-events:none;transform:translate(-50%,-50%)}
/* v3: parent report */
h3{font-size:1.1rem;font-weight:800;color:var(--ink-soft)}
.repsum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.repsum div{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.repsum b{font-size:1.5rem}.repsum span{font-size:.85rem;font-weight:700;color:var(--ink-soft)}
.replist{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px}
.ric{font-size:1.8rem}
.rmain{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.rmain b{font-size:1.05rem}.rmain small{font-size:.85rem;color:var(--ink-soft);font-weight:600}
.badge{flex:0 0 auto;font-size:.8rem;font-weight:800;border-radius:99px;padding:5px 10px;background:#EFE8DC;color:var(--ink-soft)}
.badge.up{background:var(--ok-bg);color:var(--mint-deep)}.badge.new{background:var(--sky)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:800}
@media (min-width:700px){.games{grid-template-columns:repeat(4,1fr)}.gcard{min-height:160px}.gcard .nm{font-size:1.08rem;text-align:center}
  .eq{font-size:3rem}.gitems{font-size:4.4rem}.sitem{min-height:120px;font-size:3.8rem}.basket{min-height:220px}.basket .bin{font-size:2.4rem}
  .choices.lab .choice{min-height:96px}.glabel{font-size:1.7rem}}
.arr.two{display:grid;grid-template-columns:auto auto;gap:5px 10px}

/* v3 stage 2: home sections */
.sec{display:flex;flex-direction:column;gap:10px}
.sech{font-size:1.15rem;font-weight:900;color:var(--ink);display:flex;align-items:center;gap:8px;padding:4px 4px 0}
.gcard.wide{grid-column:1/-1;flex-direction:row;justify-content:flex-start;gap:16px;min-height:96px;padding:14px 20px;text-align:start}
.gcard.wide .ic{font-size:3.2rem}
.gcard.wide .nm{font-size:1.4rem;flex:1}
/* icons */
.emo{line-height:1;display:inline-block}
.svgi{display:inline-block;width:1em;height:1em;vertical-align:middle}
.svgi svg{width:100%;height:100%;display:block}
/* AAC */
.strip{min-height:96px;background:var(--card);border:3px solid var(--mint-deep);border-radius:var(--r);padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-start;box-shadow:var(--shadow);cursor:pointer}
.strip .ph{color:var(--ink-soft);font-weight:800;font-size:1.05rem;padding:0 8px}
.scard,.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#F8F4EE;border-radius:16px;padding:6px 8px;min-width:84px;min-height:88px;font-size:2.7rem;text-align:center}
.scard .cl,.slot .cl{font-size:.8rem;font-weight:800;line-height:1.1;max-width:110px}
.slots{justify-content:center;cursor:default}
.slot{border:3px dashed #CDBFA8;background:#FBF6EC}
.slot.full{border:3px solid var(--ok);background:var(--ok-bg)}
.slot .n{font-size:1.4rem;color:#CDBFA8}

{ id: "tienda", ic: "🛒", t: ["Vamos a la tienda", "Going to the store", "Vamos ao mercado", "On va au magasin", "Wir gehen einkaufen", "Andiamo al negozio", "我们去商店", "おみせに いく", "가게에 가요", "نذهب إلى المتجر", "दुकान जाना", "Pupunta kami sa tindahan"], p: [
  { v: "🛒 🤝", s: ["Vamos a la tienda. Voy de la mano o en el carrito.", "We go to the store. I hold hands or ride in the cart.", "Vamos ao mercado. Eu vou de mãos dadas ou no carrinho.", "On va au magasin. Je donne la main ou je monte dans le chariot.", "Wir gehen einkaufen. Ich halte die Hand oder sitze im Einkaufswagen.", "Andiamo al negozio. Do la mano o salgo sul carrello.", "我们去商店。我牵着手，或者坐在购物车里。", "おみせに いきます。てを つなぐか、カートに のります。", "가게에 가요. 손을 잡거나 카트에 타요.", "نذهب إلى المتجر. أمسك اليد أو أركب في العربة.", "हम दुकान जाते हैं। मैं हाथ पकड़ता हूँ या ट्रॉली में बैठता हूँ।", "Pupunta kami sa tindahan. Hahawak ako sa kamay o sasakay sa cart."] },
  { v: "🍎 🥛 🍞", s: ["Buscamos la comida de la lista. Yo ayudo a poner las cosas.", "We look for the food on our list. I help put things in.", "Procuramos a comida da lista. Eu ajudo a colocar as coisas.", "On cherche les aliments de la liste. J'aide à mettre les choses.", "Wir suchen das Essen von der Liste. Ich helfe beim Einpacken.", "Cerchiamo il cibo della lista. Io aiuto a mettere le cose.", "我们找清单上的食物。我帮忙放东西。", "リストの たべものを さがします。いれるのを てつだいます。", "목록에 있는 음식을 찾아요. 내가 물건 넣는 걸 도와요.", "نبحث عن الطعام في القائمة. أساعد في وضع الأشياء.", "हम सूची का सामान ढूँढते हैं। मैं चीज़ें रखने में मदद करता हूँ।", "Hinahanap namin ang pagkain sa listahan. Tumutulong akong maglagay ng mga bagay."] },
  { v: "🍭 ✋", s: ["Veo dulces. A veces la respuesta es no. Respiro y espero.", "I see candy. Sometimes the answer is no. I breathe and wait.", "Vejo doces. Às vezes a resposta é não. Eu respiro e espero.", "Je vois des bonbons. Parfois, la réponse est non. Je respire et j'attends.", "Ich sehe Süßigkeiten. Manchmal heißt es nein. Ich atme und warte.", "Vedo le caramelle. A volte la risposta è no. Respiro e aspetto.", "我看到糖果。有时候答案是不行。我深呼吸，等一等。", "おかしが あります。だめな ときも あります。しんこきゅうして まちます。", "사탕이 보여요. 안 된다고 할 때도 있어요. 숨을 쉬고 기다려요.", "أرى الحلوى. أحيانًا يكون الجواب لا. أتنفس وأنتظر.", "मुझे टॉफ़ी दिखती है। कभी-कभी जवाब ना होता है। मैं साँस लेता हूँ और रुकता हूँ।", "May nakikita akong kendi. Minsan, hindi ang sagot. Hihinga ako at maghihintay."] },

/* ---------- math games (Sumas, Restas, Multiplicar) ---------- */
var MOBJ = ["🍎", "⭐", "🐟", "🎈", "🌸", "🐥", "🍓", "🍪"];

    else { do { a = rnd(1, 10); b = rnd(1, 10); } while (a + b < 9); }

    else { a = rnd(8, 20); b = rnd(1, Math.min(10, a)); }
    c = a - b;
  } else {

    else { a = rnd(2, 10); b = rnd(2, 10); }

  var seen = {}, near = [];

  var first = shuffle(near.slice(0, 4)), opts = [c, first[0], first[1]];
  return shuffle(opts);
}
function mathPrompt(f) { return t(f.kind === "add" ? "qAdd" : f.kind === "sub" ? "qSub" : "qMul", { a: f.a, b: f.b }); }
function mathEq(f) { return t(f.kind === "add" ? "eqAdd" : f.kind === "sub" ? "eqSub" : "eqMul", { a: f.a, b: f.b, c: f.c }); }

  var cols = Math.min(5, Math.max(1, n)), h = '<span class="grp" style="grid-template-columns:repeat(' + cols + ',auto)' + (fs ? ";font-size:" + fs + "px" : "") + '">';
  for (var i = 0; i < n; i++) h += crossLast && i >= n - crossLast ? '<span class="p x"><i>' + obj + "</i></span>" : '<span class="p">' + obj + "</span>";
  return h + "</span>";
}
function mathHTML(f, show) {

  if (f.kind === "add") { var tot = f.a + f.b, fs = tot <= 6 ? 40 : tot <= 10 ? 32 : 24; h += pics(f.a, f.obj, 0, fs) + '<span class="op">+</span>' + pics(f.b, f.obj, 0, fs); }
  else if (f.kind === "sub") { var fs2 = f.a <= 6 ? 40 : f.a <= 10 ? 32 : 24; h += pics(f.a, f.obj, f.b, fs2); }
  else {

    var fs3 = Math.floor(Math.min(38, 290 / (cols * 1.25), 250 / (rows * 1.3)));

var GRP_IC = ["🐾", "🍉", "🚦", "👚", "🧰", "🏠", "🧍", "🍽️"];

/* ---------- (e) Mi familia con fotos (IndexedDB on this device only; never uploaded) ---------- */
var FAMDB = "aprendoJugandoFotos", famDb = null, famCache = null;
function famOpen(cb) {
  if (famDb) return cb(famDb);
  try {
    var rq = indexedDB.open(FAMDB, 1);
    rq.onupgradeneeded = function () { rq.result.createObjectStore("p", { keyPath: "id" }); };
    rq.onsuccess = function () { famDb = rq.result; cb(famDb); };
    rq.onerror = rq.onblocked = function () { cb(null); };
  } catch (e) { cb(null); }
}
function famLS() { try { return JSON.parse(localStorage.getItem(FAMDB) || "[]") || []; } catch (e) { return []; } }
function famAll(cb) {
  famOpen(function (db) {
    if (!db) { famCache = famLS(); return cb(famCache); }
    try { var out = [], c = db.transaction("p", "readonly").objectStore("p").openCursor();
      c.onsuccess = function () { var r = c.result; if (r) { out.push(r.value); r.continue(); } else { out.sort(function (a, b) { return a.id - b.id; }); famCache = out; cb(out); } };
      c.onerror = function () { cb(famCache = famLS()); };
    } catch (e) { cb(famCache = famLS()); }
  });
}
function famPut(rec, cb) {
  famOpen(function (db) {
    if (!db) { var a = famLS().filter(function (x) { return x.id !== rec.id; }); a.push(rec); try { localStorage.setItem(FAMDB, JSON.stringify(a)); cb(true); } catch (e) { cb(false); } return; }
    try { var tx = db.transaction("p", "readwrite"); tx.objectStore("p").put(rec); tx.oncomplete = function () { cb(true); }; tx.onerror = function () { cb(false); }; } catch (e) { cb(false); }
  });
}
function famDel(id, cb) {
  famOpen(function (db) {
    if (!db) { try { localStorage.setItem(FAMDB, JSON.stringify(famLS().filter(function (x) { return x.id !== id; }))); } catch (e) {} return cb(); }
    try { var tx = db.transaction("p", "readwrite"); tx.objectStore("p").delete(id); tx.oncomplete = function () { cb(); }; tx.onerror = function () { cb(); }; } catch (e) { cb(); }
  });
}
/* photo -> square-ish JPEG, max 640 px (keeps storage small) */
function famShrink(file, cb) {
  var rd = new FileReader();
  rd.onload = function () {
    var im = new Image();
    im.onload = function () {
      var M = 640, w = im.naturalWidth, h = im.naturalHeight, k = Math.min(1, M / Math.max(w, h));
      var c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      try { cb(c.toDataURL("image/jpeg", 0.82)); } catch (e) { cb(null); }
    };
    im.onerror = function () { cb(null); }; im.src = rd.result;
  };
  rd.onerror = function () { cb(null); }; rd.readAsDataURL(file);
}
